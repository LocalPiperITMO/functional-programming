name: CI for Lab3

on:
  push:
    paths:
      - 'lab3-fixed/**'
  pull_request:
    paths:
      - 'lab3-fixed/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Leiningen
      run: |
        sudo apt-get update
        sudo apt-get install -y leiningen
    
    - name: Change directory and run linting
      run: |
        cd lab3-fixed
        lein eastwood
    
    - name: Change directory and run tests
      run: |
        cd lab3-fixed
        lein test
